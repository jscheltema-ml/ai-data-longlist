name: Python Checks
description: >
  Backend checks for the app in working_directory: ruff (lint + format-check via
  the shared ruff-check action) and the unit test suite (poetry + pytest).
  Integration tests (marked `integration`, need Azurite) are excluded here — run
  them separately with the emulator.
  NOTE: the calling job must run actions/checkout BEFORE this action.

inputs:
  working_directory:
    description: App directory containing pyproject.toml
    required: true

runs:
  using: composite
  steps:
    - name: Ruff check
      uses: Marktlink/ai-data-shared-infra/.github/actions/ruff-check@v1
      with:
        working_directory: ${{ inputs.working_directory }}

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: "3.12"

    - name: Install Poetry
      shell: bash
      run: pipx install poetry

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: poetry install --no-root

    - name: Pytest (unit)
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      # Integration tests need Azurite and would time out here; run them separately.
      run: poetry run pytest -m "not integration"
